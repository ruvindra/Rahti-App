<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ruvindra | Cloud Services Assignment</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 50px 60px;
      border-radius: 14px;
      text-align: center;
      max-width: 600px;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #cfe0ff;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .details {
      text-align: left;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 20px 25px;
      font-size: 15px;
      line-height: 1.8;
    }
    .details span {
      color: #9fd3ff;
      font-weight: bold;
    }
    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #bcd2f0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1> Hello from my CSC cPouta VPS!</h1>
    <p class="subtitle">Cloud Services Assignment — Deployed by Ruvindra</p>
    <div class="details">
      <p><span>Server:</span> Apache2 on Ubuntu</p>
      <p><span>Hosting:</span> CSC cPouta (OpenStack)</p>
      <p><span>Deployment method:</span> SCP file transfer + SSH</p>
      <p><span>Status:</span> Live and running </p>
    </div>
    <p class="footer">This page proves my VPS is publicly reachable and serving custom content.</p>
  </div>
</body>
</html>
